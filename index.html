<style>
:root { --ink:#26244A; --muted:#6B6A8A; --bg:#EAF7FF; --card:#FFFFFF; --line:#E3E7F5; --blue:#3FA9F5; --green:#34C48B; --orange:#FF9B3D; --purple:#7C5CFF; --pink:#FF6FA5; --teal:#14A38B; --gold:#FFC83D; --red:#FF5C6C;
  --ui:'Fredoka','Nunito','Segoe UI Rounded',system-ui,sans-serif; --urdu:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Noto Naskh Arabic',serif; --arabic:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; margin:0; background:var(--bg); }
body { color:var(--ink); font-family:var(--ui); font-size:17px; line-height:1.45; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
button { font-family:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0; }

#app { position:relative; max-width:520px; height:100%; margin:0 auto; overflow:hidden; display:flex; flex-direction:column; background:linear-gradient(180deg,#BFE9FF 0%,#EAF7FF 34%,#FFF6DD 100%); }
#views { flex:1; min-height:0; position:relative; }
.tab { position:absolute; inset:0; overflow-y:auto; padding:max(14px,env(safe-area-inset-top,0px)) 16px 28px; }
.tab[hidden] { display:none; }
/* bilingual text */
.b { display:block; } .b .en { display:block; font-family:var(--ui); } .b .ur { display:block; font-family:var(--urdu); direction:rtl; line-height:2; font-size:.92em; color:inherit; opacity:.88; text-align:inherit; }
.b.row2 { display:flex; gap:8px; align-items:baseline; justify-content:space-between; }
.b.only-ur .ur { font-size:1em; opacity:1; }
.ur { font-family:var(--urdu); direction:rtl; line-height:2; }
h1,h2,h3 { margin:0; font-weight:600; }
.h1 { font-size:26px; font-weight:700; } .h2 { font-size:20px; font-weight:600; } .sm { font-size:14px; }

/* header */
.top { display:flex; align-items:center; gap:10px; }
.avatar { width:56px; height:56px; flex:none; border-radius:50%; background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.08); display:flex; align-items:center; justify-content:center; }
.avatar svg { width:46px; height:46px; }
.chips { margin-inline-start:auto; display:flex; gap:6px; }

/* cards */
.card { background:var(--card); border-radius:24px; padding:14px 16px; margin-top:14px; box-shadow:0 5px 0 rgba(38,36,74,.06), 0 12px 24px rgba(38,36,74,.06); }
.hero { position:relative; color:#fff; border-radius:28px; padding:16px 18px; margin-top:14px; overflow:hidden; box-shadow:0 6px 0 rgba(0,0,0,.12); }

.btn3d { display:flex; align-items:center; justify-content:center; gap:8px; min-height:54px; padding:0 22px; border-radius:18px; font-weight:700; font-size:18px; letter-spacing:.3px; color:#fff; background:var(--c,var(--green)); box-shadow:0 5px 0 var(--cd,#1F9E6C); transition:transform .06s, box-shadow .06s; width:100%; margin-top:12px; text-transform:uppercase; }
.btn3d .b .ur { font-size:.8em; text-transform:none; }
.btn3d:active { transform:translateY(4px); box-shadow:0 1px 0 var(--cd,#1F9E6C); }
.btn3d.white { background:#fff; color:var(--ink); --cd:#D3D9EE; }
.btn3d.dis { background:#CDD2E4; --cd:#B5BBD1; color:#fff; }

.btn3d.blue { --c:var(--blue); --cd:#2380C4; } .btn3d.orange { --c:var(--orange); --cd:#D6761D; } .btn3d.purple { --c:var(--purple); --cd:#5A3FD0; } .btn3d.pink { --c:var(--pink); --cd:#D14B82; } .btn3d.red { --c:var(--red); --cd:#D63A4A; }

.row { display:flex; align-items:center; gap:14px; }

.back { width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.28); color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center; flex:none; }

.node .c:active { transform:translateY(5px); box-shadow:0 2px 0 var(--cd); }
.node.lock .c { background:#CDD2E4; --cd:#B1B7CE; filter:grayscale(.7); }
.node.cur .c { animation:pulse 1.6s infinite; }
.node .st { font-size:16px; letter-spacing:2px; min-height:22px; }
.node .nm { text-align:center; font-size:14px; font-weight:600; max-width:150px; line-height:1.3; }
.node .nm .b .ur { font-size:.85em; line-height:1.8; }
@keyframes pulse { 0%,100% { box-shadow:0 7px 0 var(--cd),0 0 0 0 rgba(255,255,255,.9); } 50% { box-shadow:0 7px 0 var(--cd),0 0 0 14px rgba(255,255,255,0); } }
/* lesson */
#lesson { position:absolute; inset:0; z-index:40; background:#fff; display:flex; flex-direction:column; }
#lesson[hidden] { display:none; }
.lhead { display:flex; align-items:center; gap:12px; padding:max(12px,env(safe-area-inset-top,0px)) 14px 8px; }
.lhead .x { width:40px; height:40px; font-size:22px; color:var(--muted); }
.pbar { flex:1; height:16px; border-radius:8px; background:#E6EAF6; overflow:hidden; }
.pbar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),#7DE2B0); border-radius:8px; transition:width .35s; }
.lbody { flex:1; overflow-y:auto; padding:6px 18px 16px; text-align:center; }
.lfoot { padding:10px 16px max(14px,env(safe-area-inset-bottom,0px)); }
.lfoot .btn3d { margin-top:0; }
.card-item .em { font-size:104px; line-height:1.25; animation:pop .5s ease; display:block; }
.card-item .em.small { font-size:64px; }
.card-item .bigtxt { font-size:76px; font-weight:700; color:var(--purple); line-height:1.1; }
.card-item .ttl { font-size:34px; font-weight:700; margin-top:6px; }
.card-item .ttl .b .ur { font-size:.8em; }
.card-item.wide .ttl { font-size:24px; }
.say { display:inline-flex; align-items:center; gap:6px; margin:6px 4px 0; min-height:46px; padding:0 18px; border-radius:23px; background:#E8F4FF; color:#1E73B8; font-weight:600; font-size:16px; box-shadow:0 3px 0 #BFDDF5; }
.say.ur { background:#E3F8EE; color:#18835A; box-shadow:0 3px 0 #BDE8D3; font-family:var(--urdu); }
.say.ar { background:#F1EBFF; color:#5A3FD0; box-shadow:0 3px 0 #D8CCF7; }
.tlines { text-align:start; margin-top:10px; }

.ar { font-family:var(--arabic); direction:rtl; font-size:36px; line-height:2.1; color:var(--purple); } .ar.sm { font-size:22px; line-height:1.9; }
.q-p { font-size:22px; font-weight:600; margin:2px 0 8px; }
.q-p .b .ur { font-size:.85em; }
.pic { font-size:96px; line-height:1.3; } .pic.small { font-size:44px; line-height:1.5; word-break:break-all; }
.word { font-size:40px; font-weight:700; margin:4px 0; } .word.big { font-size:84px; color:var(--purple); line-height:1.2; } .word.ur { font-family:var(--urdu); direction:rtl; line-height:1.9; }
.expr { font-size:46px; font-weight:700; margin:16px 0; direction:ltr; color:var(--purple); }
.num { font-size:34px; font-weight:700; } .num.ur { font-family:var(--urdu); }
.opts { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
.opts.one { grid-template-columns:1fr; }
.opt { min-height:78px; border-radius:20px; border:3px solid #E3E7F5; background:#fff; box-shadow:0 4px 0 #E3E7F5; font-size:20px; font-weight:600; padding:6px 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; line-height:1.3; }
.opt .em { font-size:46px; line-height:1.2; } .opt .b .ur { font-size:.85em; line-height:1.7; }
.opt:active { transform:translateY(3px); box-shadow:0 1px 0 #E3E7F5; }
.opt.sel { border-color:var(--blue); background:#EAF5FF; box-shadow:0 4px 0 #BFDDF5; }
.opt.ok { border-color:var(--green); background:#DDF8EA; box-shadow:0 4px 0 #A9E5C8; }
.opt.bad { border-color:var(--red); background:#FFE5E8; box-shadow:0 4px 0 #F5B7BE; animation:shake .4s; }
.fb { margin:0 -16px; padding:12px 16px max(14px,env(safe-area-inset-bottom,0px)); }
.fb.ok { background:#DDF8EA; color:#14754E; } .fb.bad { background:#FFE5E8; color:#C13040; }
.fb .row { gap:12px; }
.fb .msg { font-weight:700; font-size:20px; text-align:start; flex:1; }
.fb .msg .b .ur { font-size:.85em; font-weight:400; }
.fb .btn3d { margin-top:10px; }
.mascot { display:block; }
.mascot.sm { width:64px; height:64px; } .mascot.md { width:120px; height:120px; } .mascot.lg { width:170px; height:170px; }
.bounce { animation:bounce 1.8s ease-in-out infinite; }
@keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
@keyframes pop { 0% { transform:scale(.4); opacity:0; } 70% { transform:scale(1.12); } 100% { transform:scale(1); opacity:1; } }
@keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-7px); } 75% { transform:translateX(7px); } }
.stars3 { font-size:54px; letter-spacing:6px; } .stars3 span { display:inline-block; animation:pop .6s both; } .stars3 span:nth-child(2) { animation-delay:.25s; } .stars3 span:nth-child(3) { animation-delay:.5s; }
.off { filter:grayscale(1) opacity(.3); }
.stats { display:flex; gap:10px; margin-top:14px; }
.stat { flex:1; border-radius:18px; padding:8px; font-weight:700; font-size:22px; background:#FFF3C4; } .stat small { display:block; font-size:12px; font-weight:500; opacity:.7; }
/* badges */
.bgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:10px; }
.badge { text-align:center; font-size:12px; line-height:1.3; }
.badge svg { width:76px; height:76px; }
.badge.off svg { filter:grayscale(1) opacity(.35); }
/* checklist */
.chk { display:flex; align-items:center; gap:12px; width:100%; min-height:60px; background:#fff; border:3px solid #E3E7F5; border-radius:18px; padding:0 14px; margin-top:8px; text-align:start; font-weight:600; box-shadow:0 3px 0 #E3E7F5; }
.chk .e { font-size:26px; } .chk .b { flex:1; font-size:16px; } .chk .b .ur { font-size:.85em; }
.chk .tick { width:34px; height:34px; border-radius:50%; border:3px solid #CDD2E4; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; }
.chk[aria-pressed="true"] { background:#FFF7D6; border-color:var(--gold); box-shadow:0 3px 0 #F2D77A; }
.chk[aria-pressed="true"] .tick { background:var(--green); border-color:var(--green); }
.seg { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.seg button { flex:1; min-height:46px; border-radius:23px; border:3px solid #E3E7F5; background:#fff; font-weight:600; font-size:15px; padding:0 10px; }
.seg button[aria-pressed="true"] { background:var(--purple); border-color:var(--purple); color:#fff; }
.bars { display:flex; align-items:flex-end; gap:8px; height:100px; margin-top:10px; }
.bars div { flex:1; text-align:center; font-size:11px; color:var(--muted); display:flex; flex-direction:column; justify-content:flex-end; height:100%; }
.bars i { display:block; background:linear-gradient(180deg,var(--blue),#7CCBFF); border-radius:6px 6px 0 0; min-height:3px; margin-bottom:2px; }
.prow { display:flex; align-items:center; gap:10px; margin-top:8px; font-size:15px; } .prow .pb { flex:1; height:12px; border-radius:6px; background:#E6EAF6; overflow:hidden; } .prow .pb i { display:block; height:100%; border-radius:6px; }
.mgrid { display:grid; gap:10px; margin-top:12px; }
.mc { aspect-ratio:1; border-radius:18px; background:linear-gradient(145deg,var(--purple),#A58BFF); box-shadow:0 4px 0 #5A3FD0; color:#fff; font-size:36px; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1; padding:3px; }

/* nav */
#nav { display:flex; flex:none; background:#fff; border-top:2px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); box-shadow:0 -6px 18px rgba(38,36,74,.06); }

#toast[hidden] { display:none; } #toast .b .ur { font-size:.9em; }
#confetti { position:absolute; inset:0; z-index:100; pointer-events:none; width:100%; height:100%; }
#welcome { position:absolute; inset:0; z-index:80; overflow-y:auto; padding:max(26px,env(safe-area-inset-top,0px)) 22px 30px; text-align:center; background:linear-gradient(180deg,#BFE9FF,#FFF6DD); }
#welcome[hidden] { display:none; }
#welcome input { width:100%; min-height:56px; border-radius:18px; border:3px solid #fff; background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.08); font-family:var(--ui); font-size:20px; padding:0 16px; text-align:center; color:var(--ink); user-select:text; margin-top:8px; }
#splash { position:absolute; inset:0; z-index:95; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; background:linear-gradient(180deg,#8ED8FF,#EAF7FF 60%,#FFF6DD); transition:opacity .5s; }
#splash.gone { opacity:0; pointer-events:none; }
#splash h1 { font-size:42px; font-weight:700; margin:4px 0 0; color:#4B3DB5; } #splash .u { font-family:var(--urdu); font-size:36px; line-height:1.8; color:#4B3DB5; } #splash .dev { margin-top:14px; font-size:13px; color:var(--muted); }
.cloud { position:absolute; width:90px; height:34px; background:#fff; border-radius:30px; opacity:.85; animation:drift 14s linear infinite; } .cloud::before { content:''; position:absolute; width:44px; height:44px; background:#fff; border-radius:50%; top:-22px; left:14px; } .cloud::after { content:''; position:absolute; width:34px; height:34px; background:#fff; border-radius:50%; top:-14px; left:46px; }
@keyframes drift { from { transform:translateX(-120px); } to { transform:translateX(640px); } }
.deco { position:absolute; top:0; left:0; right:0; height:150px; pointer-events:none; overflow:hidden; }
</style>
